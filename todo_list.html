<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務 ToDo リスト</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="todo_list.css">
</head>
<body>

  <!-- ヘッダー部分 -->
  <header>
    <!-- ポータルサイトに戻るボタン -->
    <div class="back-to-portal-container">
      <a href="index.html" class="back-btn">ポータルサイトに戻る</a>
    </div>

    <h1>✔️ 業務 ToDoリスト</h1>
    <div class="notice">
      業務内容を確認して、終わったらチェックをつけてください。
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="todo-main">
    
    <!-- 時間帯切り替えタブ -->
    <div class="tab-container">
      <button class="tab-btn" onclick="switchTab('night')">夜21時頃</button>
      <button class="tab-btn" onclick="switchTab('closing-soon')">閉店間近</button>
      <button class="tab-btn" onclick="switchTab('closed')">閉店後</button>
    </div>

    <!-- 一括解除アクションエリア -->
    <div class="action-bar">
      <button type="button" class="reset-btn" onclick="resetAllChecks()">
        🔄 全てのチェックを解除する
      </button>
    </div>

    <!-- ToDoリスト表示エリア（時間帯ごとにグループ化） -->
    <div class="card todo-card">

      <!-- 夜21時頃 -->
      <div id="night" class="todo-group">
        <h2>🌙 夜21時頃のタスク</h2>
        <ul class="todo-list">
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">【飲み客】おつまみラストオーダー(21:00)</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">卓上調味料の補充</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">卓上調味料を拭く</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">コチュジャンを拭いてから片付ける</span>
            </label>
          </li>          
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">ウォーターサーバーの製氷ストップ</span>
            </label>
          </li>
        </ul>
      </div>

      <!-- 閉店間近 -->
      <div id="closing-soon" class="todo-group">
        <h2>⏳ 閉店間近のタスク</h2>
        <ul class="todo-list">
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">【飲み客】ラーメンラストオーダー(21:30)</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">【飲み客】ドリンクラストオーダー(21:50)</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">新規客ストップ(22:00)</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">暖簾を外し、営業中看板を「準備中」にする(22:00)</span>
            </label>
          </li>
        </ul>
      </div>

      <!-- 閉店後 -->
      <div id="closed" class="todo-group">
        <h2>🔒 閉店後のタスク</h2>
        <ul class="todo-list">
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">レジマイナス(必要な場合のみ)</span>
            </label>
          </li>          
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">レジ締め</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">箸補充</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">テーブルナプキン補充</span>
            </label>
          </li>          
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">卓上ボトルの水を捨て、拭いてから、1卓上に並べておく(計14個)</span>
            </label>
          </li>                  
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">ウォーターサーバー内の氷を全部出し、電源を切る</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">外ゴミを捨て、ゴミ袋を交換する</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">パーテーションを拭いて元の位置に戻す(計8枚)</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">裏倉庫から台車を持ってくる</span>
            </label>
          </li>      
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">ビールサーバー洗浄機を持ってくる</span>
            </label>
          </li>
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">暖簾と外にある案内看板を店内に入れる</span>
            </label>
          </li>   
          <li>
            <label class="todo-item">
              <input type="checkbox" onchange="toggleTask(this)">
              <span class="checkmark"></span>
              <span class="task-text">エアコン・扇風機・壁面電飾看板の電気を消す</span>
            </label>
          </li>
          </li>
        </ul>
      </div>

    </div>

  </main>

  <script src="todo_list.js"></script>
</body>
</html>
